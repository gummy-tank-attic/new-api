name: Deploy Frontend to Cloudflare Pages
# last-trigger: 2026-08-01 with correct CF_API_TOKEN (Pages Write)

on:
  push:
    branches:
      - main
      - production
      - 'metartr/*'
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:    

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build Frontend
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy web/dist --project-name=metartr-web --branch=production --commit-dirty=true
